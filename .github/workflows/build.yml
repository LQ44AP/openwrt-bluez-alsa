name: Build Bluez-ALSA (IPK & APK)

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.version }} / ${{ matrix.arch.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [23.05.6, 25.12.5]
        arch:
          - { name: mipsel_24kc,     target: ramips,   subtarget: mt7621 }
          - { name: mips_24kc,       target: ath79,    subtarget: generic }
          - { name: x86_64,          target: x86,      subtarget: 64 }
          - { name: aarch64_generic, target: rockchip, subtarget: armv8 }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext \
            libssl-dev xsltproc wget unzip python3 file zstd tar rsync libglib2.0-dev-bin

      - name: Set version-specific variables
        id: vars
        run: |
          VERSION="${{ matrix.version }}"
          if [[ "$VERSION" =~ ^25\. ]] || [[ "$VERSION" == "main" ]]; then
            echo "ext=zst"                           >> "$GITHUB_OUTPUT"
            echo "sdk_pattern=openwrt-sdk-*.tar.zst" >> "$GITHUB_OUTPUT"
          else
            echo "ext=xz"                            >> "$GITHUB_OUTPUT"
            echo "sdk_pattern=openwrt-sdk-*.tar.xz"  >> "$GITHUB_OUTPUT"
          fi

      - name: Download and Setup SDK
        run: |
          VERSION="${{ matrix.version }}"
          TARGET="${{ matrix.arch.target }}"
          SUBTARGET="${{ matrix.arch.subtarget }}"
          SDK_BASE="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET}/${SUBTARGET}/"
          PATTERN="${{ steps.vars.outputs.sdk_pattern }}"
          EXT="${{ steps.vars.outputs.ext }}"

          wget -nv -r -l1 -nd -A "$PATTERN" -e robots=off "$SDK_BASE"
          SDK_FILE=$(ls $PATTERN 2>/dev/null | head -n 1)
          [ -z "$SDK_FILE" ] && { echo "::error::No SDK found at $SDK_BASE"; exit 1; }
          echo "Found SDK: $SDK_FILE"

          if [ "$EXT" = "xz" ]; then
            tar -xJf "$SDK_FILE"
          else
            tar --zstd -xf "$SDK_FILE"
          fi

          SDK_DIR="${SDK_FILE%.tar.*}"
          [ -d "$SDK_DIR" ] || { echo "::error::SDK dir not found: $SDK_DIR"; exit 1; }
          mv "$SDK_DIR" openwrt-sdk

      - name: Update feeds
        working-directory: openwrt-sdk
        run: |
          ./scripts/feeds update -a

      - name: Install required feeds
        working-directory: openwrt-sdk
        run: |
          # 全部为必需项，缺一不可。libbsd 和 libspandsp 之前漏了，
          # 分别会导致 "missing dependencies for libbsd.so.0" 和
          # configure 阶段的 "--enable-msbc requires spandsp" 报错。
          CORE="alsa-lib bluez-daemon bluez-utils bluez-utils-extra \
                glib2 sbc dbus mpg123 fdk-aac \
                libbsd libspandsp coreutils-timeout"

          for p in $CORE; do
            ./scripts/feeds install "$p" || {
              echo "::error::Required feed package missing: $p"
              exit 1
            }
          done

      - name: Add bluez-alsa package to SDK
        run: |
          mkdir -p openwrt-sdk/package/bluez-alsa
          cp Makefile openwrt-sdk/package/bluez-alsa/
          if [ -d files ]; then
            cp -r files openwrt-sdk/package/bluez-alsa/
          fi

          # 修复 CRLF，避免 init 脚本在目标机上挂掉
          find openwrt-sdk/package/bluez-alsa/ -type f -exec sed -i 's/\r$//' {} +

          test -f openwrt-sdk/package/bluez-alsa/Makefile || {
            echo "::error::Makefile not found in openwrt-sdk/package/bluez-alsa/"
            exit 1
          }

          for f in bluealsa.init bt_monitor.sh bluealsa.config; do
            test -f "openwrt-sdk/package/bluez-alsa/files/$f" || {
              echo "::error::files/$f missing!"
              exit 1
            }
          done

          echo "=== package/bluez-alsa 内容 ==="
          find openwrt-sdk/package/bluez-alsa -maxdepth 2

      - name: Configure & Sanity check
        working-directory: openwrt-sdk
        run: |
          {
            echo "CONFIG_BUILD_PATENTED=y"          # 必须，否则 fdk-aac 不可选
            echo "CONFIG_PACKAGE_bluez-alsa=m"

            echo "CONFIG_PACKAGE_alsa-lib=y"
            echo "CONFIG_PACKAGE_bluez-daemon=y"
            echo "CONFIG_PACKAGE_bluez-utils=y"
            echo "CONFIG_PACKAGE_bluez-utils-extra=y"
            echo "CONFIG_PACKAGE_glib2=y"
            echo "CONFIG_PACKAGE_sbc=y"
            echo "CONFIG_PACKAGE_dbus=y"
            echo "CONFIG_PACKAGE_mpg123=y"
            echo "CONFIG_PACKAGE_fdk-aac=y"
            echo "CONFIG_PACKAGE_libbsd=y"
            echo "CONFIG_PACKAGE_libspandsp=y"
            echo "CONFIG_PACKAGE_coreutils-timeout=y"
          } >> .config

          make defconfig

          echo "===== Sanity check ====="
          for k in \
              CONFIG_BUILD_PATENTED \
              CONFIG_PACKAGE_bluez-alsa \
              CONFIG_PACKAGE_alsa-lib \
              CONFIG_PACKAGE_glib2 \
              CONFIG_PACKAGE_fdk-aac \
              CONFIG_PACKAGE_libbsd \
              CONFIG_PACKAGE_libspandsp ; do
            grep -q "^${k}=" .config || {
              echo "::error::$k not enabled after defconfig"
              exit 1
            }
          done
          grep -E "^CONFIG_PACKAGE_(bluez-alsa|fdk-aac|libbsd|libspandsp)=" .config

      - name: Build
        working-directory: openwrt-sdk
        run: |
          make package/bluez-alsa/compile V=s -j"$(nproc)"

      - name: Collect IPK/APK
        run: |
          mkdir -p ./deploy
          ARCH_NAME="${{ matrix.arch.name }}"
          VERSION="${{ matrix.version }}"

          FOUND=0
          while IFS= read -r -d '' FILE; do
            FOUND=1
            FILENAME=$(basename "$FILE")

            if [[ "$FILENAME" == *.apk ]]; then
              BASE_NAME="${FILENAME%.apk}"
              cp "$FILE" "./deploy/${BASE_NAME}_${VERSION}_${ARCH_NAME}.apk"
              echo "APK: $FILENAME -> ${BASE_NAME}_${VERSION}_${ARCH_NAME}.apk"
            elif [[ "$FILENAME" == *.ipk ]]; then
              cp "$FILE" "./deploy/${FILENAME%.ipk}_${VERSION}_${ARCH_NAME}.ipk"
              echo "IPK: $FILENAME -> ${FILENAME%.ipk}_${VERSION}_${ARCH_NAME}.ipk"
            fi
          done < <(find openwrt-sdk/bin/ -type f \
                     \( -name 'bluez-alsa*.ipk' -o -name 'bluez-alsa*.apk' \) -print0)

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No bluez-alsa package files produced!"
            exit 1
          fi

          echo "=== 最终产物 ==="
          ls -lh ./deploy/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bluez-alsa-${{ matrix.version }}-${{ matrix.arch.name }}
          path: ./deploy/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/*.ipk
            ./release-assets/*.apk
          body: |
            ## bluez-alsa 多架构 / 多版本自动编译

            | 格式 | 适用 OpenWrt |
            |------|--------------|
            | IPK  | 23.05.x      |
            | APK  | 25.12.x      |

            **支持架构**：`mipsel_24kc`、`mips_24kc`、`x86_64`、`aarch64_generic`

            仅包含 bluez-alsa 主程序包，不含 LuCI 界面。

          generate_release_notes: true
          fail_on_unmatched_files: false
