name: Build bluealsa LuCI Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '23.05.6'
            format: 'ipk'
            sdk_ext: 'xz'
            sdk_url: 'https://downloads.openwrt.org/releases/23.05.6/targets/x86/64/openwrt-sdk-23.05.6-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz'
          - version: '25.12.5'
            format: 'apk'
            sdk_ext: 'zst'
            sdk_url: 'https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev gawk git gettext \
            libssl-dev xsltproc wget unzip python3 file zstd

      - name: Download OpenWrt SDK
        run: |
          set -e
          wget -q -O sdk.tar.${{ matrix.sdk_ext }} "${{ matrix.sdk_url }}" || {
            echo "::error::SDK 下载失败: ${{ matrix.sdk_url }}"
            exit 1
          }
          mkdir -p sdk
          if [ "${{ matrix.sdk_ext }}" = "zst" ]; then
            tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          else
            tar -xJf sdk.tar.xz -C sdk --strip-components=1
          fi

      - name: Copy package into SDK
        run: |
          set -e
          cp -r ./luci-app-bluealsa sdk/package/luci-app-bluealsa

          # bt-pair 可执行位（存在才 chmod）
          BP=sdk/package/luci-app-bluealsa/root/usr/bin/bt-pair
          [ -f "$BP" ] && chmod +x "$BP"

          # CRLF 修复，避免脚本在目标机上挂掉
          find sdk/package/luci-app-bluealsa -type f \
            -exec sed -i 's/\r$//' {} +

          echo "=== package tree ==="
          find sdk/package/luci-app-bluealsa -type f | sort

      - name: Update feeds
        working-directory: sdk
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: sdk
        run: |
          set -e
          echo "CONFIG_PACKAGE_luci-app-bluealsa=m" >> .config
          make defconfig

          if ! grep -q '^CONFIG_PACKAGE_luci-app-bluealsa=m' .config; then
            echo "::error::luci-app-bluealsa 未启用，可能是依赖未满足"
            echo "---- 相关依赖解析结果 ----"
            grep -E '^CONFIG_PACKAGE_(bluez-alsa|luci-app-bluealsa)=' .config || true
            echo "---- 本地包目录 ----"
            ls -la package/ | grep -E 'blue|luci' || true
            exit 1
          fi

      - name: Build LuCI package only
        working-directory: sdk
        run: |
          set -e
          make package/luci-app-bluealsa/compile V=s

      - name: Collect packages
        run: |
          set -e
          mkdir -p dist
          find sdk/bin -type f \
            \( -name 'luci-app-bluealsa*.ipk' \
               -o -name 'luci-app-bluealsa*.apk' \) \
            -exec cp -v {} dist/ \;
          echo "=== collected ==="
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bluealsa-luci-${{ matrix.version }}-${{ matrix.format }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
